# ONNX export, quantization and benchmark settings (steps 4-6).
seed: 0
imgsz: 640
opset: 17
dynamic: false
simplify: true
# Detections kept per image after NMS. 500 > busiest image in val (317) and test-dev (461), so mAP
# is never capped. Not 300: Ultralytics val silently raises the default 300 to the dataset maximum,
# so an explicit 300 would not be what actually runs.
max_det: 500

calibration:
  split: train          # never calibrate on val/test
  num_images: 300       # random sample, drawn with `seed`
  method: MinMax        # MinMax, Entropy or Percentile

quantize:
  op_types: [Conv, MatMul]  # compute-heavy ops; SiLU, decode and NMS inputs stay float
  per_channel: true         # one scale per output channel of each conv weight
  activation_type: QUInt8
  weight_type: QInt8
  # No VNNI on this CPU: ORT's U8S8 kernels use VPMADDUBSW, which saturates. 7-bit weights avoid
  # it: static INT8 mAP50-95 -25% -> -9% (results/quantization_experiments.csv). Applied to static
  # INT8 only; dynamic INT8 gets worse with it (-12% -> -36%).
  reduce_range: true
  # The six final head convs (box and class outputs), kept in float32
  exclude: ['/model\.23/cv[23]\.\d/cv[23]\.\d\.2/Conv']

benchmark:
  warmup: 20
  runs: 200
  batch: 1
  intra_op_threads: 4   # fixed so results are comparable across variants
  images: 20            # val images cycled through, so NMS sees realistic crowding
  conf: 0.25            # deployment threshold for NMS (val uses 0.001, far more boxes)
  iou: 0.7              # NMS IoU threshold, Ultralytics default
